# Local-first Docker Compose deployment (SQLite/kuzu/ChromaDB defaults).
#
# Redis is deliberately NOT included: nothing in this project uses a task
# queue or needs cross-process caching (Section 55: "Only include Redis
# if required").

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FRAUDSHIELD_DB_URL=sqlite:////data/fraudshield.db
      - GRAPH_BACKEND=kuzu
      - KUZU_DB_PATH=/data/graph_db
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - fraudshield_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fraudshield_data:

# --- Optional profile: Postgres + Neo4j instead of local defaults. ---
#
# Add this to the `backend` service's environment to use them:
#   - FRAUDSHIELD_DB_URL=postgresql://fraudshield:fraudshield@postgres:5432/fraudshield
#   - GRAPH_BACKEND=neo4j
#   - NEO4J_URI=bolt://neo4j:7687
#   - NEO4J_USER=neo4j
#   - NEO4J_PASSWORD=your-password
#
# and add these two services:
#
#   postgres:
#     image: postgres:16-alpine
#     environment:
#       - POSTGRES_USER=fraudshield
#       - POSTGRES_PASSWORD=your-password
#       - POSTGRES_DB=fraudshield
#     ports:
#       - "5432:5432"
#     volumes:
#       - postgres_data:/var/lib/postgresql/data
#
#   neo4j:
#     image: neo4j:5
#     environment:
#       - NEO4J_AUTH=neo4j/your-password
#     ports:
#       - "7474:7474"
#       - "7687:7687"
#     volumes:
#       - neo4j_data:/data
#
# (and add postgres_data / neo4j_data to the top-level `volumes:` block)
